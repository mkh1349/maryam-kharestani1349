<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>یادبود مریم خارستانی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--ink:#f3efe9;--soft:#b5aea6;--accent:#e9dcc0;--line:#3a3631;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Amiri","Vazirmatn",Tahoma,serif;font-weight:400;line-height:2;color-scheme:dark;-webkit-font-smoothing:antialiased}
.photo{position:relative;max-width:1200px;margin:0 auto}
.photo img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;animation:rise 1.8s ease-out both}
.photo::after{content:"";position:absolute;inset:auto 0 0 0;height:30%;background:linear-gradient(to bottom,transparent,var(--bg))}
@keyframes rise{from{opacity:0;filter:blur(8px)}to{opacity:1;filter:none}}
main{max-width:640px;margin:-2.5rem auto 0;padding:0 1.5rem 4rem;text-align:center;position:relative;z-index:1}
.lead{margin:0;color:var(--soft);font-size:1rem}
h1{font-family:"Aref Ruqaa","Amiri",serif;font-weight:700;font-size:clamp(2.6rem,9vw,4.2rem);line-height:1.5;margin:.2rem 0 0;color:var(--accent)}
.rule{width:56px;height:1px;background:var(--line);margin:1.6rem auto}
.msg{font-size:1.05rem;line-height:2.2;margin:0 0 1rem}
.dua{font-family:"Aref Ruqaa","Amiri",serif;font-size:1.15rem;color:var(--accent);margin:1rem 0 0}
footer{border-top:1px solid var(--line);padding:1.5rem;text-align:center;color:var(--soft);font-size:.8rem}
.voices{margin-top:2.5rem;display:grid;gap:.9rem}
.voices p{margin:0;color:var(--soft);font-size:.9rem}
audio{width:100%;max-width:420px;margin:0 auto;display:block;height:44px}
@media (max-width:600px){.photo img{aspect-ratio:4/3}main{margin-top:-1.5rem}}
@media (prefers-reduced-motion:reduce){.photo img{animation:none}}
</style>
</head>

<h1>مریم خارستانی</h1>

<p class="msg">کسی که دوستش داریم هرگز نمی‌رود؛ فقط از چشم دور می‌شود و در دلِ ما خانه می‌کند. مهربانی و لبخندش، مثل عطر گل‌های سپید، همیشه با ماست.</p>
